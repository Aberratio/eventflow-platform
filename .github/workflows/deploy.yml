name: Deploy frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Where should the frontend be deployed?"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      deploy_method:
        description: "How should the frontend be uploaded?"
        required: true
        default: ftp
        type: choice
        options:
          - ftp
          - ssh
      skipTests:
        description: "Skip frontend tests before build?"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  DEPLOY_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_method || 'ftp' }}
  SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skipTests || false }}

jobs:
  # dev and staging share this job; production has its own below.
  deploy-staging:
    name: Deploy frontend ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'staging' || inputs.deploy_target == 'dev'))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        if: env.SKIP_TESTS != 'true'
        run: npm run validate

      - name: Validate deploy method
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_METHOD" in
            ftp|ssh) ;;
            "")
              echo "DEPLOY_METHOD is empty. Falling back to ftp."
              echo "DEPLOY_METHOD=ftp" >> "$GITHUB_ENV"
              ;;
            *)
              echo "DEPLOY_METHOD must be ftp or ssh."
              exit 20
              ;;
          esac

      # dev: VITE_API_URL comes from .env.dev, so the API_URL secret is optional
      # there (when set, it still wins). staging still requires it.
      - name: Build ${{ env.DEPLOY_TARGET }}
        env:
          API_URL: ${{ secrets.API_URL }}
          VITE_STAGING_GATE_PASSWORD: ${{ secrets.VITE_STAGING_GATE_PASSWORD }}
          CSP_REPORT_ONLY: ${{ vars.CSP_REPORT_ONLY }}
          CSP_CONNECT_SRC_EXTRA: ${{ vars.CSP_CONNECT_SRC_EXTRA }}
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_TARGET" in
            dev | staging) ;;
            *)
              echo "This job builds dev or staging only (got '$DEPLOY_TARGET')."
              exit 22
              ;;
          esac
          if [ -n "$API_URL" ]; then
            export VITE_API_URL="$API_URL"
            echo "Building $DEPLOY_TARGET frontend with API_URL from the $DEPLOY_TARGET GitHub Environment."
          elif [ "$DEPLOY_TARGET" = "dev" ]; then
            echo "Building dev frontend with VITE_API_URL from .env.dev."
          else
            echo "API_URL is required in the selected GitHub Environment secrets."
            exit 21
          fi
          export VITE_APP_RELEASE="${GITHUB_SHA}"
          export VITE_APP_VERSION="$([ "$GITHUB_REF_TYPE" = tag ] && printf %s "${GITHUB_REF_NAME#v}" || true)"
          npm run "build:$DEPLOY_TARGET"

      - name: Verify generated .htaccess
        run: |
          set -Eeuo pipefail
          test -f dist/.htaccess
          test -f dist/embed.html
          grep -q "Content-Security-Policy" dist/.htaccess
          cmp -s dist/index.html dist/embed.html

      - name: Deploy by FTP
        if: env.DEPLOY_METHOD == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      - name: Package dist
        if: env.DEPLOY_METHOD == 'ssh'
        run: |
          set -Eeuo pipefail
          cd dist
          zip -r ../frontend.zip .

      - name: Configure SSH
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_HOST, SSH_PORT, SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS are required."
            exit 30
          fi

          case "$SSH_HOST" in
            http://*|https://*|*/*)
              echo "SSH_HOST must be a hostname only, for example h29.seohost.pl."
              exit 31
              ;;
          esac

          case "$SSH_PORT" in
            ''|*[!0-9]*)
              echo "SSH_PORT must be a number."
              exit 32
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "SSH_KNOWN_HOSTS is empty."
            exit 34
          fi

      - name: Upload and unpack by SSH
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_REMOTE_DIR: ${{ secrets.FRONTEND_REMOTE_DIR }}
          FRONTEND_ALLOWED_ROOT: ${{ secrets.FRONTEND_ALLOWED_ROOT }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSH_USER" ] || [ -z "$FRONTEND_REMOTE_DIR" ] || [ -z "$FRONTEND_ALLOWED_ROOT" ]; then
            echo "SSH_USER, FRONTEND_REMOTE_DIR and FRONTEND_ALLOWED_ROOT are required."
            exit 35
          fi

          DEPLOY_ID="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          REMOTE_ZIP="$FRONTEND_REMOTE_DIR/.deploy/frontend-${DEPLOY_ID}.zip"
          printf -v REMOTE_ENV 'FRONTEND_REMOTE_DIR=%q FRONTEND_ALLOWED_ROOT=%q REMOTE_ZIP=%q DEPLOY_ID=%q' "$FRONTEND_REMOTE_DIR" "$FRONTEND_ALLOWED_ROOT" "$REMOTE_ZIP" "$DEPLOY_ID"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -Eeuo pipefail

          if [ -z "$FRONTEND_REMOTE_DIR" ]; then
            echo "FRONTEND_REMOTE_DIR is required."
            exit 10
          fi

          if [ -z "$FRONTEND_ALLOWED_ROOT" ]; then
            echo "FRONTEND_ALLOWED_ROOT is required."
            exit 13
          fi

          case "$FRONTEND_ALLOWED_ROOT" in
            /*) ;;
            *)
              echo "FRONTEND_ALLOWED_ROOT must be an absolute path."
              exit 18
              ;;
          esac

          case "$FRONTEND_REMOTE_DIR" in
            /|.|~|"$HOME")
              echo "FRONTEND_REMOTE_DIR cannot point to /, ., ~ or home."
              exit 14
              ;;
          esac

          case "$FRONTEND_REMOTE_DIR" in
            *..*)
              echo "FRONTEND_REMOTE_DIR cannot contain '..'."
              exit 11
              ;;
          esac

          command -v realpath >/dev/null
          FRONTEND_REMOTE_DIR_REAL="$(realpath -e "$FRONTEND_REMOTE_DIR")"
          FRONTEND_ALLOWED_ROOT_REAL="$(realpath -e "$FRONTEND_ALLOWED_ROOT")"

          case "$FRONTEND_REMOTE_DIR_REAL/" in
            "$FRONTEND_ALLOWED_ROOT_REAL"/*|"$FRONTEND_ALLOWED_ROOT_REAL/") ;;
            *)
              echo "FRONTEND_REMOTE_DIR is outside FRONTEND_ALLOWED_ROOT."
              echo "FRONTEND_REMOTE_DIR_REAL=$FRONTEND_REMOTE_DIR_REAL"
              echo "FRONTEND_ALLOWED_ROOT_REAL=$FRONTEND_ALLOWED_ROOT_REAL"
              exit 15
              ;;
          esac

          case "$FRONTEND_REMOTE_DIR_REAL" in
            *public_html|*public_html/*|*public_html/) ;;
            *)
              echo "FRONTEND_REMOTE_DIR must point to public_html or a directory inside public_html."
              exit 12
              ;;
          esac

          if [ ! -d "$FRONTEND_REMOTE_DIR_REAL" ]; then
            echo "FRONTEND_REMOTE_DIR must already exist."
            exit 16
          fi

          if [ ! -f "$FRONTEND_REMOTE_DIR_REAL/.zmierzymy-czas-frontend-root" ]; then
            echo "Missing marker file: $FRONTEND_REMOTE_DIR_REAL/.zmierzymy-czas-frontend-root"
            exit 17
          fi

          mkdir -p "$FRONTEND_REMOTE_DIR_REAL/.deploy"
          REMOTE

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" frontend.zip "$SSH_USER@$SSH_HOST:$REMOTE_ZIP"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -Eeuo pipefail
          FRONTEND_REMOTE_DIR_REAL="$(realpath -e "$FRONTEND_REMOTE_DIR")"
          FRONTEND_ALLOWED_ROOT_REAL="$(realpath -e "$FRONTEND_ALLOWED_ROOT")"
          case "$FRONTEND_REMOTE_DIR_REAL/" in
            "$FRONTEND_ALLOWED_ROOT_REAL"/*|"$FRONTEND_ALLOWED_ROOT_REAL/") ;;
            *)
              echo "FRONTEND_REMOTE_DIR is outside FRONTEND_ALLOWED_ROOT."
              exit 15
              ;;
          esac
          REMOTE_ZIP="$FRONTEND_REMOTE_DIR_REAL/.deploy/frontend-${DEPLOY_ID}.zip"
          unzip -o -q "$REMOTE_ZIP" -d "$FRONTEND_REMOTE_DIR_REAL"
          rm -f "$REMOTE_ZIP"
          echo "Frontend unpacked into $FRONTEND_REMOTE_DIR_REAL"
          REMOTE

      - name: Health check
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -Eeuo pipefail
          if [ -z "$FRONTEND_URL" ] && [ "$DEPLOY_TARGET" = "dev" ]; then
            FRONTEND_URL="https://portal-dev.zmierzymyczas.kokot.it"
          fi
          curl --fail --show-error --location "$FRONTEND_URL"

  deploy-production:
    name: Deploy frontend production
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        if: env.SKIP_TESTS != 'true'
        run: npm run validate

      - name: Validate deploy method
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_METHOD" in
            ftp|ssh) ;;
            "")
              echo "DEPLOY_METHOD is empty. Falling back to ftp."
              echo "DEPLOY_METHOD=ftp" >> "$GITHUB_ENV"
              ;;
            *)
              echo "DEPLOY_METHOD must be ftp or ssh."
              exit 20
              ;;
          esac

      - name: Build production
        env:
          API_URL: ${{ secrets.API_URL }}
          VITE_APP_ENV: production
          VITE_ALLOW_INDEXING: "true"
          CSP_REPORT_ONLY: ${{ vars.CSP_REPORT_ONLY }}
          CSP_CONNECT_SRC_EXTRA: ${{ vars.CSP_CONNECT_SRC_EXTRA }}
        run: |
          set -Eeuo pipefail
          if [ -z "$API_URL" ]; then
            echo "API_URL is required in the selected GitHub Environment secrets."
            exit 21
          fi
          export VITE_API_URL="$API_URL"
          export VITE_APP_RELEASE="${GITHUB_SHA}"
          export VITE_APP_VERSION="$([ "$GITHUB_REF_TYPE" = tag ] && printf %s "${GITHUB_REF_NAME#v}" || true)"
          echo "Building production frontend with API_URL from the production GitHub Environment."
          npm run build

      - name: Verify generated .htaccess
        run: |
          set -Eeuo pipefail
          test -f dist/.htaccess
          test -f dist/embed.html
          grep -q "Content-Security-Policy" dist/.htaccess
          cmp -s dist/index.html dist/embed.html

      - name: Deploy by FTP
        if: env.DEPLOY_METHOD == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      - name: Package dist
        if: env.DEPLOY_METHOD == 'ssh'
        run: |
          set -Eeuo pipefail
          cd dist
          zip -r ../frontend.zip .

      - name: Configure SSH
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
